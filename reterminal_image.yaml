# https://github.com/Incipiens/Adam-Home-Assistant-Snippets/blob/main/ESPHome/reTerminal%20E1002%20-%20ComfyUI/reTerminal-E1002-ComfyUI.yaml
esphome:
  name: reterminal
  friendly_name: reTerminal E1002
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_sd_enable
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable Home Assistant API with encryption and actions
api:
  encryption:
    key: "5DcIShZ+Vs1xdzaUPexRETOHrJC3RFsXoAg38lTlbtw="
  on_client_connected: 
    then:
      - script.execute: cycle_image_now

ota:
  - platform: esphome
    password: "b49a1482da5019087c5b74f6ce602c7d"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Reterminal Fallback Hotspot"
    password: "pO7Mcnss4ncD"


http_request:
  verify_ssl: false
  timeout: 10s
  watchdog_timeout: 15s

online_image:
  - id: gallery_img
    format: png
    type: RGB
    transparency: alpha_channel
    url: "http://192.168.86.248:8000/DM41L_pouch_large.png"
    on_download_finished:
      - component.update: epaper_display

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://lublak/esphome@pull/1/head
    components: [waveshare_epaper]
    refresh: 1h

i2s_audio:
  - id: i2s0
    i2s_bclk_pin: GPIO42     # PDM clock from schematic
    i2s_lrclk_pin: GPIO2 



# Deep-sleep, wake by GPIO4
deep_sleep:
  id: deep_sleep_1
  run_duration: 20min
  sleep_duration: 60min    
  wakeup_pin: 
    number: GPIO4 # Right white button
    allow_other_uses: true
    mode:
      input: True
      pulldown: True
  wakeup_pin_mode: INVERT_WAKEUP


spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
i2c:
  scl: GPIO20
  sda: GPIO19


globals:
  - id: should_debug
    type: bool
    restore_value: no
    initial_value: "true"

  - id: current_index
    type: int
    initial_value: '1'


sensor:
  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_led
    inverted: true
  - platform: gpio
    pin: GPIO16
    id: bsp_sd_enable
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

# Onboard LED
light:
  - platform: binary
    name: "Onboard LED"
    output: bsp_led
    id: onboard_led
    
binary_sensor:
  - platform: gpio    # Next page
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key1
    name: "Key1"
    on_press:
      then:
        - script.execute: cycle_image_now

  - platform: gpio     # Prev page
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: key2
    name: "Key2"
    on_press:
      then:
        - script.execute: cycle_image_now

  - platform: gpio     # Right white button
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: key3
    name: "Key3"
    on_press:
      then:
        - script.execute: cycle_image_now

# Home Assistant time
time:
  - platform: homeassistant
    id: ha_time

script:
  - id: cycle_image_now
    mode: restart
    then:
      # Give MQTT a moment after wake to deliver the retained message (usually instant)
    # id(gallery_img).set_url("http://192.168.86.248:8000/Venn_diagram_rgb.png");
      - delay: 200ms
      - lambda: |-
          id(gallery_img).set_url("http://192.168.86.248:8000/DM41L_pouch_large.png");

      - delay: 200ms
      - component.update: gallery_img
      - wait_until:
          condition:
            lambda: 'return id(gallery_img).is_ready();'
          timeout: 60s

# define font to display words
font:
  - file: "fonts/Theinhardt-Medium.ttf"
    id: myFont24
    size: 145

#    extras:
#      - file: "fonts/materialdesignicons-webfont.ttf"
#        glyphs: [
#          "\U000F02D1", # mdi-heart
#          "\U000F05D4", # mdi-airplane-landing
#          ]

  - file: "fonts/Theinhardt-Medium.ttf"
    id: Theinhardt_Medium_32
    size: 32
  - file: "fonts/Theinhardt-Medium.ttf"
    id: Theinhardt_Medium_48
    size: 48


text:
  - platform: template
    name: "Display Title"
    id: display_title
    mode: text
    optimistic: true
    on_value:
      then:
        - component.update: epaper_display
  - platform: template
    name: "Display Text 1"
    id: display_text1
    mode: text
    optimistic: true
    on_value:
      then:
        - component.update: epaper_display
  - platform: template
    name: "Display Text 2"
    id: display_text2
    mode: text
    optimistic: true
    on_value:
      then:
        - component.update: epaper_display

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.30in-e
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-

      const auto RED = Color(255, 0, 0, 0);
      const auto GREEN = Color(0, 255, 0, 0);
      const auto BLUE = Color(0, 0, 255, 0);
      const auto BLACK   = Color(0,   0,   0,   0);
      it.printf(-5, -30, id(myFont24), RED, "%s", id(display_title).state.c_str());
      it.image(200, 20, id(gallery_img));
      it.printf(0, 130, id(Theinhardt_Medium_32), GREEN, "%s", id(display_text1).state.c_str());
      it.printf(0, 230, id(Theinhardt_Medium_48), BLUE, "%s", id(display_text2).state.c_str());

# Enable logging
logger:
  
