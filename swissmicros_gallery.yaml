# SwissMicros calculator gallery for the reTerminal E1002, tuned for battery life.
#
# - Shows one calculator from the SwissMicros webshop, advancing once a day.
# - Left white button: previous image. Right white button: next image.
# - Green button: WiFi setup. Opens the "SwissMicros Gallery" access point with a
#   captive portal for 5 minutes. Also starts by itself on power-on while no
#   WiFi credentials are stored.
# - The device wakes, refreshes the panel (~20 s) and deep-sleeps until the next
#   day or button press. On the daily wake, once WiFi is set up, it briefly
#   connects and installs a newer firmware from the latest GitHub release.
#
# Images: tools/build_images.py renders images/*.png and packs them into
# gallery_images.h (run with --pack-only before building).
# Flash: esphome run swissmicros_gallery.yaml --device /dev/ttyUSB0
# Release builds set the version: esphome -s version 1.2.0 compile ...

substitutions:
  version: dev  # "dev" builds never auto-update
  manifest_url: https://github.com/michaelsteinmann/reTerminal/releases/latest/download/manifest.json

esphome:
  name: reterminal-gallery
  friendly_name: SwissMicros Gallery
  project:
    name: swissmicros.reterminal-gallery
    version: ${version}
  includes:
    - gallery_images.h
    - gallery.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          const int step = gallery_step_for_wakeup();
          id(img_index) = ((id(img_index) + step) % GALLERY_COUNT + GALLERY_COUNT) % GALLERY_COUNT;
          id(setup_mode) = gallery_setup_requested() || (gallery_power_on() && !id(wifi_configured));
          ESP_LOGI("gallery", "v${version} wake cause %d, step %d -> image %d, setup %d",
                   (int) esp_sleep_get_wakeup_cause(), step, id(img_index), id(setup_mode));
      - script.execute: read_battery
      - script.wait: read_battery
      - if:
          condition:
            lambda: 'return id(setup_mode);'
          then:
            - script.execute: wifi_setup
            - script.wait: wifi_setup
          else:
            - script.execute: render
            - script.wait: render
            # Buttons pressed while the panel was refreshing.
            - while:
                condition:
                  lambda: 'return id(pending_steps) != 0;'
                then:
                  - lambda: |-
                      id(img_index) = ((id(img_index) + id(pending_steps)) % GALLERY_COUNT + GALLERY_COUNT) % GALLERY_COUNT;
                      id(pending_steps) = 0;
                  - script.execute: render
                  - script.wait: render
            - if:
                condition:
                  lambda: |-
                    return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER && id(wifi_configured) &&
                           std::string("${version}") != "dev";
                then:
                  - script.execute: daily_update_check
                  - script.wait: daily_update_check
      - deep_sleep.enter:
          id: deep_sleep_1
          sleep_duration: !lambda 'return gallery_ms_until_next_change();'

esp32:
  board: esp32-s3-devkitc-1
  # 32MB works too, but OTA on 32MB is still experimental in ESPHome.
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Don't re-hash the 10 MB image on every wake (~2 s of awake time).
      CONFIG_BOOTLOADER_SKIP_VALIDATE_IN_DEEP_SLEEP: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0  # USB-C port's serial chip (/dev/ttyUSB0)

# No networks here: credentials come from the captive portal and are kept in
# flash (also across OTA updates). WiFi only runs when a script enables it.
wifi:
  enable_on_boot: false
  reboot_timeout: 0s
  power_save_mode: LIGHT
  ap:
    ssid: SwissMicros Gallery
    # Saved network unreachable during setup -> fall back to the portal quickly.
    # Longer than the daily check's connect timeout, so that never opens the AP.
    ap_timeout: 25s
  on_connect:
    - globals.set:
        id: wifi_configured
        value: "true"

captive_portal:

http_request:
  timeout: 15s
  watchdog_timeout: 30s

ota:
  - platform: http_request
    id: ota_github

update:
  - platform: http_request
    id: fw_update
    name: Firmware
    internal: true
    source: ${manifest_url}
    update_interval: never

deep_sleep:
  id: deep_sleep_1
  # Safety net: if anything ever hangs, sleep anyway (setup mode needs 5 min).
  run_duration: 10min
  sleep_duration: 1h
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3  # green button: WiFi setup
      - number: GPIO4  # right white button
        allow_other_uses: true
      - number: GPIO5  # left white button
        allow_other_uses: true
    mode: ANY_LOW

globals:
  - id: img_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: wifi_configured
    type: bool
    restore_value: true
    initial_value: "false"
  - id: pending_steps
    type: int
    restore_value: false
    initial_value: "0"
  - id: setup_mode
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  - platform: gpio
    id: key_next
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - lambda: 'id(pending_steps)++;'
  - platform: gpio
    id: key_prev
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - lambda: 'id(pending_steps)--;'

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    samples: 8
    update_interval: never
    filters:
      - multiply: 2.0

script:
  - id: read_battery
    then:
      - output.turn_on: battery_enable
      - delay: 20ms
      - component.update: battery_voltage
      - output.turn_off: battery_enable
      - lambda: 'ESP_LOGI("gallery", "battery %.2f V", id(battery_voltage).state);'

  - id: render
    then:
      - component.update: epaper_display
      # The display runs a state machine in its loop and disables the loop when done.
      - wait_until:
          condition:
            lambda: 'return !id(epaper_display).is_idle();'
          timeout: 5s
      - wait_until:
          condition:
            lambda: 'return id(epaper_display).is_idle();'
          timeout: 90s

  # Show instructions, run the captive portal until WiFi connects (max 5 min),
  # then check for an update and go back to the gallery.
  - id: wifi_setup
    then:
      - script.execute: render  # setup_mode is on: draws the setup screen
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 5min
      - lambda: 'id(setup_mode) = false;'
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: 'ESP_LOGI("gallery", "WiFi connected");'
            - script.execute: check_and_install
            - script.wait: check_and_install
          else:
            - lambda: 'ESP_LOGW("gallery", "WiFi setup timed out");'
      - wifi.disable:
      - script.wait: render
      - script.execute: render
      - script.wait: render

  - id: daily_update_check
    then:
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 20s
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: check_and_install
            - script.wait: check_and_install
          else:
            - lambda: 'ESP_LOGW("gallery", "WiFi not reachable, skipping update check");'
      - wifi.disable:

  # Fetch the release manifest; if its version differs, flash it and reboot.
  - id: check_and_install
    then:
      - if:
          condition:
            lambda: 'return std::string("${version}") == "dev";'
          then:
            - lambda: 'ESP_LOGI("gallery", "dev build, not checking for updates");'
          else:
            - update.check: fw_update
            - wait_until:
                condition:
                  lambda: |-
                    return id(fw_update).state != update::UPDATE_STATE_UNKNOWN || id(fw_update).status_has_error();
                timeout: 40s
            - lambda: |-
                ESP_LOGI("gallery", "installed ${version}, latest release '%s'",
                         id(fw_update).update_info.latest_version.c_str());
            - if:
                condition:
                  update.is_available:
                    id: fw_update
                then:
                  - update.perform: fw_update
                  # Reboots on success; on failure we just carry on and sleep.
                  - wait_until:
                      condition:
                        lambda: 'return id(fw_update).state != update::UPDATE_STATE_INSTALLING;'
                      timeout: 5min

font:
  - file: "gfonts://Roboto@700"
    id: font_small
    size: 20
    glyphs: "0123456789%"
  - file: "gfonts://Roboto@700"
    id: font_title
    size: 44
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@400"
    id: font_text
    size: 26
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const auto black = Color(0, 0, 0), white = Color(255, 255, 255), red = Color(255, 0, 0);

      if (id(setup_mode)) {
        it.fill(white);
        it.filled_rectangle(0, 0, 800, 12, red);
        it.print(40, 50, id(font_title), black, "WiFi setup");
        it.print(40, 130, id(font_text), black, "1. On your phone or computer, join the WiFi network");
        it.print(70, 168, id(font_title), red, "SwissMicros Gallery");
        it.print(40, 240, id(font_text), black, "2. A setup page opens (or browse to http://192.168.4.1).");
        it.print(40, 285, id(font_text), black, "3. Choose your WiFi network and enter its password.");
        it.print(40, 350, id(font_text), black, "The device then checks GitHub for firmware updates once a day.");
        it.print(40, 388, id(font_text), black, "Setup closes after 5 minutes. Green button: start again.");
        it.printf(40, 440, id(font_text), black, "Firmware ${version}");
      } else {
        // Two pixels per byte, high nibble first; values index GALLERY_PALETTE.
        Color palette[6];
        for (int i = 0; i < 6; i++)
          palette[i] = Color(GALLERY_PALETTE[i][0], GALLERY_PALETTE[i][1], GALLERY_PALETTE[i][2]);
        const uint8_t *px = GALLERY_IMAGES[id(img_index)];
        for (int y = 0; y < GALLERY_H; y++) {
          for (int x = 0; x < GALLERY_W; x += 2, px++) {
            it.draw_pixel_at(x, y, palette[*px >> 4]);
            it.draw_pixel_at(x + 1, y, palette[*px & 0x0F]);
          }
        }
      }

      // Battery icon + percentage, bottom-right corner (empty on every layout).
      const float v = id(battery_voltage).state;
      if (!std::isnan(v)) {
        const int pct = gallery_battery_percent(v);
        // Fill colour by charge: green > 50 %, yellow 21-50 %, red <= 20 %.
        const auto fill = pct > 50 ? Color(0, 255, 0) : pct > 20 ? Color(255, 255, 0) : red;
        const int x = 734, y = 452, w = 36, h = 18;  // battery body
        it.filled_rectangle(684, 446, 116, 30, white);
        it.printf(x - 6, y + h / 2, id(font_small), black, TextAlign::CENTER_RIGHT, "%d%%", pct);
        it.rectangle(x, y, w, h, black);
        it.rectangle(x + 1, y + 1, w - 2, h - 2, black);
        it.filled_rectangle(x + w, y + 5, 3, h - 10, black);
        const int level = (w - 6) * pct / 100;
        if (level > 0)
          it.filled_rectangle(x + 3, y + 3, level, h - 6, fill);
      }
