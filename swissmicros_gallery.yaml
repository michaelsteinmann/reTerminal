# SwissMicros calculator gallery for the reTerminal E1002, tuned for battery life.
#
# - Shows one calculator from the SwissMicros webshop, advancing once a day.
# - Left white button: previous image. Right white button: next image.
# - Green button: switch between the gallery and a 10-day weather forecast for
#   Sagogn (top) and Stäfa (bottom), in German. The forecast is fetched at about
#   05:00 every day and when switching to it; there the white buttons show
#   days 1-5 / 6-10. An orange banner suggests a trip to Sagogn when it is much
#   nicer there for 3+ days in a row (weather.h).
# - Green button held for 3 s: WiFi setup. Opens the "SwissMicros Gallery"
#   access point with a captive portal for 5 minutes. Also starts by itself on
#   power-on while no WiFi credentials are stored.
# - The device wakes, refreshes the panel (~20 s) and deep-sleeps until the next
#   day or button press. On the daily wake (and after power-on), once WiFi is
#   set up, it briefly connects and installs the latest GitHub release if its
#   version differs.
#
# Images: tools/build_images.py renders images/*.png and packs them into
# gallery_images.h (run with --pack-only before building).
# Flash: esphome run swissmicros_gallery.yaml --device /dev/ttyUSB0
# Release builds set the version: esphome -s version 1.2.0 compile ...

substitutions:
  version: dev  # "dev" builds never auto-update
  # Below this charge no panel refresh is started (0 = off). Independently, a
  # refresh that crashed blocks refreshes until the battery is charged again.
  min_battery_percent: "0"
  manifest_url: https://github.com/michaelsteinmann/reTerminal/releases/latest/download/manifest.json

esphome:
  name: reterminal-gallery
  friendly_name: SwissMicros Gallery
  project:
    name: swissmicros.reterminal-gallery
    version: ${version}
  includes:
    - gallery_images.h
    - gallery.h
    - weather.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          const int step = gallery_step_for_wakeup();
          // The gallery keeps advancing daily in weather mode; there the white buttons turn
          // the forecast pages instead. Any other wake starts again on the first page.
          if (!id(weather_mode) || esp_sleep_get_wakeup_cause() != ESP_SLEEP_WAKEUP_EXT1)
            id(img_index) = ((id(img_index) + step) % GALLERY_COUNT + GALLERY_COUNT) % GALLERY_COUNT;
          if (!weather_page_wake())
            weather_page = 0;
          else if (id(weather_mode))
            weather_turn_page(step);
          id(setup_mode) = gallery_power_on() && !id(wifi_configured);
          ESP_LOGI("gallery", "v${version} wake cause %d, step %d -> image %d, weather %d",
                   (int) esp_sleep_get_wakeup_cause(), step, id(img_index), id(weather_mode));
      # Green button: a short press switches gallery <-> weather, holding it starts WiFi setup.
      - if:
          condition:
            lambda: 'return gallery_setup_requested();'
          then:
            - wait_until:
                condition:
                  binary_sensor.is_off: key_setup
                timeout: 2s
            - lambda: |-
                if (id(key_setup).state)
                  id(setup_mode) = true;
                else
                  id(weather_mode) = !id(weather_mode);
                ESP_LOGI("gallery", "green button: setup %d, weather %d", id(setup_mode), id(weather_mode));
      - script.execute: read_battery
      - script.wait: read_battery
      - lambda: 'gallery_battery_check_crash();'
      # Battery too low for a refresh: don't start one (it would crash halfway and
      # leave a half-drawn image), just sleep until the next day or button press.
      - if:
          condition:
            lambda: 'return !gallery_battery_can_refresh(id(battery_voltage).state, ${min_battery_percent});'
          then:
            - lambda: |-
                ESP_LOGW("gallery", "battery too low for a refresh (%.2f V, last crash at %.2f V), sleeping",
                         id(battery_voltage).state, gallery_battery_crash_v());
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: !lambda 'return gallery_ms_until_next_change();'
      - if:
          condition:
            lambda: 'return id(setup_mode);'
          then:
            - script.execute: wifi_setup
            - script.wait: wifi_setup
          else:
            - if:
                condition:
                  lambda: 'return id(weather_mode);'
                then:
                  - script.execute: weather_show
                  - script.wait: weather_show
                else:
                  - script.execute: render
                  - script.wait: render
                  # Buttons pressed while the panel was refreshing.
                  - while:
                      condition:
                        lambda: 'return id(pending_steps) != 0;'
                      then:
                        - lambda: |-
                            id(img_index) = ((id(img_index) + id(pending_steps)) % GALLERY_COUNT + GALLERY_COUNT) % GALLERY_COUNT;
                            id(pending_steps) = 0;
                        - script.execute: render
                        - script.wait: render
                  - if:
                      condition:
                        lambda: |-
                          // Daily wake, or power-on/reset (e.g. new battery); never on button wakes.
                          return (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER || gallery_power_on()) &&
                                 id(wifi_configured) && std::string("${version}") != "dev";
                      then:
                        - script.execute: daily_update_check
                        - script.wait: daily_update_check
      - deep_sleep.enter:
          id: deep_sleep_1
          sleep_duration: !lambda 'return id(weather_mode) ? weather_ms_until_next_fetch() : gallery_ms_until_next_change();'

esp32:
  board: esp32-s3-devkitc-1
  # 32MB works too, but OTA on 32MB is still experimental in ESPHome.
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Don't re-hash the 10 MB image on every wake (~2 s of awake time).
      CONFIG_BOOTLOADER_SKIP_VALIDATE_IN_DEEP_SLEEP: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0  # USB-C port's serial chip (/dev/ttyUSB0)

# No networks here: credentials come from the captive portal and are kept in
# flash (also across OTA updates). WiFi only runs when a script enables it.
wifi:
  enable_on_boot: false
  reboot_timeout: 0s
  power_save_mode: LIGHT
  ap:
    ssid: SwissMicros Gallery
    # Saved network unreachable during setup -> fall back to the portal quickly.
    # Longer than the daily check's connect timeout, so that never opens the AP.
    ap_timeout: 25s
  on_connect:
    - globals.set:
        id: wifi_configured
        value: "true"

captive_portal:

http_request:
  timeout: 15s
  watchdog_timeout: 30s
  # GitHub redirects release downloads to a signed URL of ~900 characters; it
  # must fit in the response header buffer and in the follow-up request line.
  buffer_size_rx: 4096
  buffer_size_tx: 2048

ota:
  - platform: http_request
    id: ota_github
    # Called about once per second during the download: blink the LED.
    on_progress:
      - lambda: |-
          static bool led_on = false;
          led_on = !led_on;
          id(status_led).set_state(led_on);
          ESP_LOGI("gallery", "update %.0f%%", x);
    on_end:
      - output.turn_off: status_led
    on_error:
      - output.turn_off: status_led

update:
  - platform: http_request
    id: fw_update
    name: Firmware
    internal: true
    source: ${manifest_url}
    update_interval: never

deep_sleep:
  id: deep_sleep_1
  # Safety net: if anything ever hangs, sleep anyway (setup mode needs 5 min).
  run_duration: 10min
  sleep_duration: 1h
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3  # green button: weather / WiFi setup
        allow_other_uses: true
      - number: GPIO4  # right white button
        allow_other_uses: true
      - number: GPIO5  # left white button
        allow_other_uses: true
    mode: ANY_LOW

globals:
  - id: img_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: wifi_configured
    type: bool
    restore_value: true
    initial_value: "false"
  - id: weather_mode
    type: bool
    restore_value: true
    initial_value: "false"
  - id: pending_steps
    type: int
    restore_value: false
    initial_value: "0"
  - id: setup_mode
    type: bool
    restore_value: false
    initial_value: "false"
  - id: updating
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  - platform: gpio
    id: key_setup
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
  - platform: gpio
    id: key_next
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - lambda: 'id(pending_steps)++;'
  - platform: gpio
    id: key_prev
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - lambda: 'id(pending_steps)--;'

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable
  - platform: gpio
    pin: GPIO6
    id: status_led
    inverted: true

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    samples: 8
    update_interval: never
    filters:
      - multiply: 2.0

script:
  - id: read_battery
    then:
      - output.turn_on: battery_enable
      - delay: 20ms
      - component.update: battery_voltage
      - output.turn_off: battery_enable
      - lambda: 'ESP_LOGI("gallery", "battery %.2f V", id(battery_voltage).state);'

  - id: render
    then:
      - lambda: 'gallery_refresh_begin(id(battery_voltage).state);'
      - component.update: epaper_display
      # The display runs a state machine in its loop and disables the loop when done.
      - wait_until:
          condition:
            lambda: 'return !id(epaper_display).is_idle();'
          timeout: 5s
      - wait_until:
          condition:
            lambda: 'return id(epaper_display).is_idle();'
          timeout: 90s
      # Completed: the crash banner (gallery screen only) has been shown, clear it.
      - lambda: 'gallery_refresh_end(!id(setup_mode) && !id(updating) && !id(weather_mode));'

  # Show instructions, run the captive portal until WiFi connects (max 5 min),
  # then check for an update and go back to the gallery.
  - id: wifi_setup
    then:
      - script.execute: render  # setup_mode is on: draws the setup screen
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 5min
      - lambda: 'id(setup_mode) = false;'
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: 'ESP_LOGI("gallery", "WiFi connected");'
            - if:
                condition:
                  lambda: 'return id(weather_mode);'
                then:
                  - script.execute: weather_fetch
                  - script.wait: weather_fetch
            - script.execute: check_and_install
            - script.wait: check_and_install
          else:
            - lambda: 'ESP_LOGW("gallery", "WiFi setup timed out");'
      - wifi.disable:
      - script.wait: render
      - script.execute: render
      - script.wait: render

  # Weather mode: fetch the forecast (and on the daily wake check for an
  # update meanwhile), then show it. Without WiFi it shows the last forecast.
  - id: weather_show
    then:
      # A white button only turns the page; anything else fetches a new forecast.
      - if:
          condition:
            lambda: 'return !(weather_page_wake() && weather_data.valid);'
          then:
            - if:
                condition:
                  lambda: 'return id(wifi_configured);'
                then:
                  - wifi.enable:
                  - wait_until:
                      condition:
                        wifi.connected:
                      timeout: 20s
            - if:
                condition:
                  wifi.connected:
                then:
                  - script.execute: weather_fetch
                  - script.wait: weather_fetch
                  - if:
                      condition:
                        lambda: |-
                          return (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER || gallery_power_on()) &&
                                 std::string("${version}") != "dev";
                      then:
                        - script.execute: check_and_install
                        - script.wait: check_and_install
                else:
                  - lambda: |-
                      ESP_LOGW("weather", "WiFi not reachable");
                      weather_fetch_failed();
            - wifi.disable:
      - script.execute: render
      - script.wait: render
      # Buttons pressed while the panel was refreshing.
      - while:
          condition:
            lambda: 'return id(pending_steps) != 0;'
          then:
            - if:
                condition:
                  lambda: |-
                    const int steps = id(pending_steps);
                    id(pending_steps) = 0;
                    return weather_turn_page(steps);
                then:
                  - script.execute: render
                  - script.wait: render

  # Needs WiFi.
  - id: weather_fetch
    then:
      - http_request.get:
          url: !lambda 'return std::string(WEATHER_URL);'
          capture_response: true
          max_response_buffer_size: 8kB
          on_response:
            - lambda: |-
                if (response->status_code != 200 || !weather_parse(body)) {
                  ESP_LOGW("weather", "fetch failed: HTTP %d", response->status_code);
                  weather_fetch_failed();
                }
          on_error:
            - lambda: |-
                ESP_LOGW("weather", "fetch failed");
                weather_fetch_failed();

  - id: daily_update_check
    then:
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 20s
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: check_and_install
            - script.wait: check_and_install
          else:
            - lambda: 'ESP_LOGW("gallery", "WiFi not reachable, skipping update check");'
      - wifi.disable:

  # Fetch the release manifest; if its version differs, flash it and reboot.
  - id: check_and_install
    then:
      - if:
          condition:
            lambda: 'return std::string("${version}") == "dev";'
          then:
            - lambda: 'ESP_LOGI("gallery", "dev build, not checking for updates");'
          else:
            - update.check: fw_update
            - wait_until:
                condition:
                  lambda: |-
                    return id(fw_update).state != update::UPDATE_STATE_UNKNOWN || id(fw_update).status_has_error();
                timeout: 40s
            - lambda: |-
                ESP_LOGI("gallery", "installed ${version}, latest release '%s'",
                         id(fw_update).update_info.latest_version.c_str());
            - if:
                condition:
                  update.is_available:
                    id: fw_update
                then:
                  # The panel can't refresh during the download (it blocks the main
                  # loop), so show the update screen first; the LED blinks meanwhile.
                  - lambda: 'id(updating) = true;'
                  - script.execute: render
                  - script.wait: render
                  - update.perform: fw_update
                  # Reboots on success; on failure go back to the gallery and sleep.
                  - wait_until:
                      condition:
                        lambda: 'return id(fw_update).state != update::UPDATE_STATE_INSTALLING;'
                      timeout: 5min
                  - lambda: 'id(updating) = false;'
                  - script.execute: render
                  - script.wait: render

font:
  - file: "gfonts://Roboto@700"
    id: font_small
    size: 20
    glyphs: "0123456789%"
  - file: "gfonts://Roboto@700"
    id: font_title
    size: 44
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@400"
    id: font_text
    size: 26
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@700"
    id: font_temp
    size: 30
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@700"
    id: font_tip
    size: 22
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@400"
    id: font_note
    size: 20
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const auto black = Color(0, 0, 0), white = Color(255, 255, 255), red = Color(255, 0, 0);

      if (id(updating)) {
        it.fill(white);
        it.filled_rectangle(0, 0, 800, 12, red);
        it.print(40, 50, id(font_title), black, "Firmware-Update");
        it.printf(40, 130, id(font_title), red, "${version}  auf  %s", id(fw_update).update_info.latest_version.c_str());
        it.print(40, 220, id(font_text), black, "Die neue Firmware wird von GitHub geladen (etwa 1 Minute).");
        it.print(40, 258, id(font_text), black, "Die LED blinkt während des Downloads.");
        it.print(40, 320, id(font_text), black, "Danach startet das Gerät neu und zeigt wieder die Galerie.");
        it.print(40, 358, id(font_text), black, "Bitte währenddessen nicht die Reset-Taste drücken.");
      } else if (id(setup_mode)) {
        it.fill(white);
        it.filled_rectangle(0, 0, 800, 12, red);
        it.print(40, 50, id(font_title), black, "WLAN einrichten");
        it.print(40, 130, id(font_text), black, "1. Am Handy oder Computer mit diesem WLAN verbinden:");
        it.print(70, 168, id(font_title), red, "SwissMicros Gallery");
        it.print(40, 240, id(font_text), black, "2. Die Einrichtungsseite öffnet sich (sonst http://192.168.4.1).");
        it.print(40, 285, id(font_text), black, "3. Dein WLAN auswählen und das Passwort eingeben.");
        it.print(40, 350, id(font_text), black, "Danach sucht das Gerät täglich auf GitHub nach Updates.");
        it.print(40, 388, id(font_text), black, "Schliesst nach 5 Minuten. Grüne Taste halten: neu starten.");
        it.printf(40, 440, id(font_text), black, "Firmware ${version}");
      } else if (id(weather_mode)) {
        const auto blue = Color(0, 0, 255);
        static const char *const weekdays[] = {"So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
        const WeatherData &w = weather_data;
        it.fill(white);
        if (!w.valid) {
          it.filled_rectangle(0, 0, 800, 12, blue);
          it.print(40, 50, id(font_title), black, "Wetter");
          it.print(40, 130, id(font_text), black, id(wifi_configured) ? "Vorhersage nicht geladen. Neuer Versuch in 3 Stunden."
                                                                      : "Zuerst WLAN einrichten: grüne Taste 3 Sekunden halten.");
          it.print(40, 168, id(font_text), black, "Grüne Taste: zurück zur Galerie.");
        } else {
          int tip_first = 0, tip_len = 0;
          const bool tip = weather_tip(tip_first, tip_len);
          for (int p = 0; p < WEATHER_PLACES; p++) {
            const WeatherPlace &place = w.places[p];
            // Mirrored: Sagogn's bar above its days, Stäfa's below, the trip tip in between.
            // The day names only once, at the top. y0 is the icons' centre line.
            const int bar = p == 0 ? 0 : 404, y0 = p == 0 ? 110 : 296;
            it.filled_rectangle(0, bar, 800, 36, blue);
            it.print(16, bar + 18, id(font_temp), white, TextAlign::CENTER_LEFT, WEATHER_NAMES[p]);
            if (!std::isnan(place.t_now))
              it.printf(784, bar + 18, id(font_text), white, TextAlign::CENTER_RIGHT, "jetzt %.0f°", place.t_now);
            for (int i = 0; i < WEATHER_PAGE_DAYS; i++) {
              const int day = weather_page * WEATHER_PAGE_DAYS + i;
              const WeatherDay &d = place.days[day];
              const int cx = 80 + 160 * i;
              if (p == 0 && day == 0)
                it.print(cx, 56, id(font_text), black, TextAlign::CENTER, "Heute");
              else if (p == 0)
                it.printf(cx, 56, id(font_text), black, TextAlign::CENTER, "%s %d.", weekdays[d.weekday], d.day);
              weather_draw::icon(it, cx, y0, d);
              it.print(cx, y0 + 55, id(font_temp), black, TextAlign::CENTER, "/");
              it.printf(cx - 10, y0 + 55, id(font_temp), red, TextAlign::CENTER_RIGHT, "%.0f°", d.t_max);
              it.printf(cx + 10, y0 + 55, id(font_temp), blue, TextAlign::CENTER_LEFT, "%.0f°", d.t_min);
              // Decimal comma: "2,1 mm".
              const int tenths = std::isnan(d.precip_mm) ? 0 : int(std::lround(d.precip_mm * 10));
              const auto wet_color = tenths >= 1 ? blue : black;
              if (d.precip_prob >= 0)
                it.printf(cx, y0 + 86, id(font_note), wet_color, TextAlign::CENTER, "%d,%d mm  %d%%", tenths / 10,
                          tenths % 10, d.precip_prob);
              else
                it.printf(cx, y0 + 86, id(font_note), wet_color, TextAlign::CENTER, "%d,%d mm", tenths / 10, tenths % 10);
            }
          }
          // Between the halves: suggest a trip to Sagogn.
          if (tip) {
            float away_h = 0, home_h = 0, away_t = 0, home_t = 0;
            for (int i = tip_first; i < tip_first + tip_len; i++) {
              away_h += w.places[WEATHER_AWAY].days[i].sun_h;
              home_h += w.places[WEATHER_HOME].days[i].sun_h;
              away_t += w.places[WEATHER_AWAY].days[i].t_max;
              home_t += w.places[WEATHER_HOME].days[i].t_max;
            }
            const WeatherDay &a = w.places[WEATHER_AWAY].days[tip_first];
            const WeatherDay &b = w.places[WEATHER_AWAY].days[tip_first + tip_len - 1];
            // Orange: the panel has no orange, so a red/yellow checkerboard.
            it.filled_rectangle(0, 214, 800, 32, Color(255, 255, 0));
            for (int y = 214; y < 246; y++)
              for (int x = y % 2; x < 800; x += 2)
                it.draw_pixel_at(x, y, red);
            it.printf(400, 230, id(font_tip), black, TextAlign::CENTER,
                      "Ab nach %s! %s %d.%d. – %s %d.%d.: %d statt %d Std. Sonne, %d° statt %d°",
                      WEATHER_NAMES[WEATHER_AWAY], weekdays[a.weekday], a.day, a.month, weekdays[b.weekday], b.day,
                      b.month, int(std::lround(away_h / tip_len)), int(std::lround(home_h / tip_len)),
                      int(std::lround(away_t / tip_len)), int(std::lround(home_t / tip_len)));
          }
          if (w.stale)
            it.printf(16, 464, id(font_note), red, TextAlign::CENTER_LEFT, "Offline seit %s, neuer Versuch alle 3 h",
                      w.updated);
          else
            it.printf(16, 464, id(font_note), black, TextAlign::CENTER_LEFT, "Aktualisiert %s, nächste um %02d:00",
                      w.updated, WEATHER_REFRESH_HOUR);
          // Which button shows the other days (left of the battery indicator).
          const int other = weather_page + 1 < WEATHER_PAGES ? weather_page + 1 : weather_page - 1;
          it.printf(668, 464, id(font_note), black, TextAlign::CENTER_RIGHT, "%s Taste: Tage %d–%d",
                    other > weather_page ? "Rechte" : "Linke", other * WEATHER_PAGE_DAYS + 1,
                    (other + 1) * WEATHER_PAGE_DAYS);
        }
      } else {
        // Two pixels per byte, high nibble first; values index GALLERY_PALETTE.
        Color palette[6];
        for (int i = 0; i < 6; i++)
          palette[i] = Color(GALLERY_PALETTE[i][0], GALLERY_PALETTE[i][1], GALLERY_PALETTE[i][2]);
        const uint8_t *px = GALLERY_IMAGES[id(img_index)];
        for (int y = 0; y < GALLERY_H; y++) {
          for (int x = 0; x < GALLERY_W; x += 2, px++) {
            it.draw_pixel_at(x, y, palette[*px >> 4]);
            it.draw_pixel_at(x + 1, y, palette[*px & 0x0F]);
          }
        }
        // The previous refresh crashed on an empty battery: say at which charge.
        const float crash_v = gallery_battery_crash_v();
        if (crash_v > 0) {
          it.filled_rectangle(0, 0, 800, 36, red);
          it.printf(400, 18, id(font_text), white, TextAlign::CENTER, "Akku bei der Aktualisierung leer geworden: %.2f V (%d%%)",
                    crash_v, gallery_battery_percent(crash_v));
        }
      }

      // Battery icon + percentage, bottom-right corner (empty on every layout).
      const float v = id(battery_voltage).state;
      if (!std::isnan(v)) {
        const int pct = gallery_battery_percent(v);
        // Fill colour by charge: green > 50 %, yellow 21-50 %, red <= 20 %.
        const auto fill = pct > 50 ? Color(0, 255, 0) : pct > 20 ? Color(255, 255, 0) : red;
        const int x = 734, y = 455, w = 36, h = 18;  // battery body, centred on the weather footer line (464)
        it.filled_rectangle(684, y - 6, 116, 30, white);
        it.printf(x - 6, y + h / 2, id(font_small), black, TextAlign::CENTER_RIGHT, "%d%%", pct);
        it.rectangle(x, y, w, h, black);
        it.rectangle(x + 1, y + 1, w - 2, h - 2, black);
        it.filled_rectangle(x + w, y + 5, 3, h - 10, black);
        const int level = (w - 6) * pct / 100;
        if (level > 0)
          it.filled_rectangle(x + 3, y + 3, level, h - 6, fill);
      }
