# SwissMicros calculator gallery for the reTerminal E1002, tuned for battery life.
#
# - Shows one calculator from the SwissMicros webshop, advancing once a day.
# - Left white button: previous image. Right white button: next image.
# - Green button: switch between the gallery and the weather forecast for
#   Sagogn (top) and Stäfa (bottom). The forecast is fetched at about 05:00
#   every day and on every button press while it is shown.
# - Green button held for 3 s: WiFi setup. Opens the "SwissMicros Gallery"
#   access point with a captive portal for 5 minutes. Also starts by itself on
#   power-on while no WiFi credentials are stored.
# - The device wakes, refreshes the panel (~20 s) and deep-sleeps until the next
#   day or button press. On the daily wake (and after power-on), once WiFi is
#   set up, it briefly connects and installs the latest GitHub release if its
#   version differs.
#
# Images: tools/build_images.py renders images/*.png and packs them into
# gallery_images.h (run with --pack-only before building).
# Flash: esphome run swissmicros_gallery.yaml --device /dev/ttyUSB0
# Release builds set the version: esphome -s version 1.2.0 compile ...

substitutions:
  version: dev  # "dev" builds never auto-update
  # Below this charge no panel refresh is started (0 = off). Independently, a
  # refresh that crashed blocks refreshes until the battery is charged again.
  min_battery_percent: "0"
  manifest_url: https://github.com/michaelsteinmann/reTerminal/releases/latest/download/manifest.json

esphome:
  name: reterminal-gallery
  friendly_name: SwissMicros Gallery
  project:
    name: swissmicros.reterminal-gallery
    version: ${version}
  includes:
    - gallery_images.h
    - gallery.h
    - weather.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          const int step = gallery_step_for_wakeup();
          // The gallery keeps advancing daily in weather mode, but the white buttons don't page it.
          if (!id(weather_mode) || esp_sleep_get_wakeup_cause() != ESP_SLEEP_WAKEUP_EXT1)
            id(img_index) = ((id(img_index) + step) % GALLERY_COUNT + GALLERY_COUNT) % GALLERY_COUNT;
          id(setup_mode) = gallery_power_on() && !id(wifi_configured);
          ESP_LOGI("gallery", "v${version} wake cause %d, step %d -> image %d, weather %d",
                   (int) esp_sleep_get_wakeup_cause(), step, id(img_index), id(weather_mode));
      # Green button: a short press switches gallery <-> weather, holding it starts WiFi setup.
      - if:
          condition:
            lambda: 'return gallery_setup_requested();'
          then:
            - wait_until:
                condition:
                  binary_sensor.is_off: key_setup
                timeout: 2s
            - lambda: |-
                if (id(key_setup).state)
                  id(setup_mode) = true;
                else
                  id(weather_mode) = !id(weather_mode);
                ESP_LOGI("gallery", "green button: setup %d, weather %d", id(setup_mode), id(weather_mode));
      - script.execute: read_battery
      - script.wait: read_battery
      - lambda: 'gallery_battery_check_crash();'
      # Battery too low for a refresh: don't start one (it would crash halfway and
      # leave a half-drawn image), just sleep until the next day or button press.
      - if:
          condition:
            lambda: 'return !gallery_battery_can_refresh(id(battery_voltage).state, ${min_battery_percent});'
          then:
            - lambda: |-
                ESP_LOGW("gallery", "battery too low for a refresh (%.2f V, last crash at %.2f V), sleeping",
                         id(battery_voltage).state, gallery_battery_crash_v());
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: !lambda 'return gallery_ms_until_next_change();'
      - if:
          condition:
            lambda: 'return id(setup_mode);'
          then:
            - script.execute: wifi_setup
            - script.wait: wifi_setup
          else:
            - if:
                condition:
                  lambda: 'return id(weather_mode);'
                then:
                  - script.execute: weather_show
                  - script.wait: weather_show
                else:
                  - script.execute: render
                  - script.wait: render
                  # Buttons pressed while the panel was refreshing.
                  - while:
                      condition:
                        lambda: 'return id(pending_steps) != 0;'
                      then:
                        - lambda: |-
                            id(img_index) = ((id(img_index) + id(pending_steps)) % GALLERY_COUNT + GALLERY_COUNT) % GALLERY_COUNT;
                            id(pending_steps) = 0;
                        - script.execute: render
                        - script.wait: render
                  - if:
                      condition:
                        lambda: |-
                          // Daily wake, or power-on/reset (e.g. new battery); never on button wakes.
                          return (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER || gallery_power_on()) &&
                                 id(wifi_configured) && std::string("${version}") != "dev";
                      then:
                        - script.execute: daily_update_check
                        - script.wait: daily_update_check
      - deep_sleep.enter:
          id: deep_sleep_1
          sleep_duration: !lambda 'return id(weather_mode) ? weather_ms_until_next_fetch() : gallery_ms_until_next_change();'

esp32:
  board: esp32-s3-devkitc-1
  # 32MB works too, but OTA on 32MB is still experimental in ESPHome.
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Don't re-hash the 10 MB image on every wake (~2 s of awake time).
      CONFIG_BOOTLOADER_SKIP_VALIDATE_IN_DEEP_SLEEP: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0  # USB-C port's serial chip (/dev/ttyUSB0)

# No networks here: credentials come from the captive portal and are kept in
# flash (also across OTA updates). WiFi only runs when a script enables it.
wifi:
  enable_on_boot: false
  reboot_timeout: 0s
  power_save_mode: LIGHT
  ap:
    ssid: SwissMicros Gallery
    # Saved network unreachable during setup -> fall back to the portal quickly.
    # Longer than the daily check's connect timeout, so that never opens the AP.
    ap_timeout: 25s
  on_connect:
    - globals.set:
        id: wifi_configured
        value: "true"

captive_portal:

http_request:
  timeout: 15s
  watchdog_timeout: 30s
  # GitHub redirects release downloads to a signed URL of ~900 characters; it
  # must fit in the response header buffer and in the follow-up request line.
  buffer_size_rx: 4096
  buffer_size_tx: 2048

ota:
  - platform: http_request
    id: ota_github
    # Called about once per second during the download: blink the LED.
    on_progress:
      - lambda: |-
          static bool led_on = false;
          led_on = !led_on;
          id(status_led).set_state(led_on);
          ESP_LOGI("gallery", "update %.0f%%", x);
    on_end:
      - output.turn_off: status_led
    on_error:
      - output.turn_off: status_led

update:
  - platform: http_request
    id: fw_update
    name: Firmware
    internal: true
    source: ${manifest_url}
    update_interval: never

deep_sleep:
  id: deep_sleep_1
  # Safety net: if anything ever hangs, sleep anyway (setup mode needs 5 min).
  run_duration: 10min
  sleep_duration: 1h
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3  # green button: weather / WiFi setup
        allow_other_uses: true
      - number: GPIO4  # right white button
        allow_other_uses: true
      - number: GPIO5  # left white button
        allow_other_uses: true
    mode: ANY_LOW

globals:
  - id: img_index
    type: int
    restore_value: true
    initial_value: "0"
  - id: wifi_configured
    type: bool
    restore_value: true
    initial_value: "false"
  - id: weather_mode
    type: bool
    restore_value: true
    initial_value: "false"
  - id: pending_steps
    type: int
    restore_value: false
    initial_value: "0"
  - id: setup_mode
    type: bool
    restore_value: false
    initial_value: "false"
  - id: updating
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  - platform: gpio
    id: key_setup
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
  - platform: gpio
    id: key_next
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - lambda: 'id(pending_steps)++;'
  - platform: gpio
    id: key_prev
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    on_press:
      - lambda: 'id(pending_steps)--;'

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable
  - platform: gpio
    pin: GPIO6
    id: status_led
    inverted: true

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    samples: 8
    update_interval: never
    filters:
      - multiply: 2.0

script:
  - id: read_battery
    then:
      - output.turn_on: battery_enable
      - delay: 20ms
      - component.update: battery_voltage
      - output.turn_off: battery_enable
      - lambda: 'ESP_LOGI("gallery", "battery %.2f V", id(battery_voltage).state);'

  - id: render
    then:
      - lambda: 'gallery_refresh_begin(id(battery_voltage).state);'
      - component.update: epaper_display
      # The display runs a state machine in its loop and disables the loop when done.
      - wait_until:
          condition:
            lambda: 'return !id(epaper_display).is_idle();'
          timeout: 5s
      - wait_until:
          condition:
            lambda: 'return id(epaper_display).is_idle();'
          timeout: 90s
      # Completed: the crash banner (gallery screen only) has been shown, clear it.
      - lambda: 'gallery_refresh_end(!id(setup_mode) && !id(updating) && !id(weather_mode));'

  # Show instructions, run the captive portal until WiFi connects (max 5 min),
  # then check for an update and go back to the gallery.
  - id: wifi_setup
    then:
      - script.execute: render  # setup_mode is on: draws the setup screen
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 5min
      - lambda: 'id(setup_mode) = false;'
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: 'ESP_LOGI("gallery", "WiFi connected");'
            - if:
                condition:
                  lambda: 'return id(weather_mode);'
                then:
                  - script.execute: weather_fetch
                  - script.wait: weather_fetch
            - script.execute: check_and_install
            - script.wait: check_and_install
          else:
            - lambda: 'ESP_LOGW("gallery", "WiFi setup timed out");'
      - wifi.disable:
      - script.wait: render
      - script.execute: render
      - script.wait: render

  # Weather mode: fetch the forecast (and on the daily wake check for an
  # update meanwhile), then show it. Without WiFi it shows the last forecast.
  - id: weather_show
    then:
      - if:
          condition:
            lambda: 'return id(wifi_configured);'
          then:
            - wifi.enable:
            - wait_until:
                condition:
                  wifi.connected:
                timeout: 20s
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: weather_fetch
            - script.wait: weather_fetch
            - if:
                condition:
                  lambda: |-
                    return (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER || gallery_power_on()) &&
                           std::string("${version}") != "dev";
                then:
                  - script.execute: check_and_install
                  - script.wait: check_and_install
          else:
            - lambda: |-
                ESP_LOGW("weather", "WiFi not reachable");
                weather_fetch_failed();
      - wifi.disable:
      - script.execute: render
      - script.wait: render

  # Needs WiFi.
  - id: weather_fetch
    then:
      - http_request.get:
          url: !lambda 'return std::string(WEATHER_URL);'
          capture_response: true
          max_response_buffer_size: 8kB
          on_response:
            - lambda: |-
                if (response->status_code != 200 || !weather_parse(body)) {
                  ESP_LOGW("weather", "fetch failed: HTTP %d", response->status_code);
                  weather_fetch_failed();
                }
          on_error:
            - lambda: |-
                ESP_LOGW("weather", "fetch failed");
                weather_fetch_failed();

  - id: daily_update_check
    then:
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 20s
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: check_and_install
            - script.wait: check_and_install
          else:
            - lambda: 'ESP_LOGW("gallery", "WiFi not reachable, skipping update check");'
      - wifi.disable:

  # Fetch the release manifest; if its version differs, flash it and reboot.
  - id: check_and_install
    then:
      - if:
          condition:
            lambda: 'return std::string("${version}") == "dev";'
          then:
            - lambda: 'ESP_LOGI("gallery", "dev build, not checking for updates");'
          else:
            - update.check: fw_update
            - wait_until:
                condition:
                  lambda: |-
                    return id(fw_update).state != update::UPDATE_STATE_UNKNOWN || id(fw_update).status_has_error();
                timeout: 40s
            - lambda: |-
                ESP_LOGI("gallery", "installed ${version}, latest release '%s'",
                         id(fw_update).update_info.latest_version.c_str());
            - if:
                condition:
                  update.is_available:
                    id: fw_update
                then:
                  # The panel can't refresh during the download (it blocks the main
                  # loop), so show the update screen first; the LED blinks meanwhile.
                  - lambda: 'id(updating) = true;'
                  - script.execute: render
                  - script.wait: render
                  - update.perform: fw_update
                  # Reboots on success; on failure go back to the gallery and sleep.
                  - wait_until:
                      condition:
                        lambda: 'return id(fw_update).state != update::UPDATE_STATE_INSTALLING;'
                      timeout: 5min
                  - lambda: 'id(updating) = false;'
                  - script.execute: render
                  - script.wait: render

font:
  - file: "gfonts://Roboto@700"
    id: font_small
    size: 20
    glyphs: "0123456789%"
  - file: "gfonts://Roboto@700"
    id: font_title
    size: 44
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@400"
    id: font_text
    size: 26
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@700"
    id: font_temp
    size: 30
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "gfonts://Roboto@400"
    id: font_note
    size: 20
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # Weather icons, see weather_icon() in weather.h.
  - file: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: font_icon
    size: 60
    glyphs: [
      "\U000F0599", "\U000F0595", "\U000F0590", "\U000F0591", "\U000F0597", "\U000F0596",
      "\U000F067F", "\U000F0598", "\U000F0F36", "\U000F067E",
    ]

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const auto black = Color(0, 0, 0), white = Color(255, 255, 255), red = Color(255, 0, 0);

      if (id(updating)) {
        it.fill(white);
        it.filled_rectangle(0, 0, 800, 12, red);
        it.print(40, 50, id(font_title), black, "Updating firmware");
        it.printf(40, 130, id(font_title), red, "${version}  to  %s", id(fw_update).update_info.latest_version.c_str());
        it.print(40, 220, id(font_text), black, "Downloading the new firmware from GitHub (about 1 minute).");
        it.print(40, 258, id(font_text), black, "The LED blinks while it downloads.");
        it.print(40, 320, id(font_text), black, "Then the device restarts and shows the gallery again.");
        it.print(40, 358, id(font_text), black, "Please don't press the reset button meanwhile.");
      } else if (id(setup_mode)) {
        it.fill(white);
        it.filled_rectangle(0, 0, 800, 12, red);
        it.print(40, 50, id(font_title), black, "WiFi setup");
        it.print(40, 130, id(font_text), black, "1. On your phone or computer, join the WiFi network");
        it.print(70, 168, id(font_title), red, "SwissMicros Gallery");
        it.print(40, 240, id(font_text), black, "2. A setup page opens (or browse to http://192.168.4.1).");
        it.print(40, 285, id(font_text), black, "3. Choose your WiFi network and enter its password.");
        it.print(40, 350, id(font_text), black, "The device then checks GitHub for firmware updates once a day.");
        it.print(40, 388, id(font_text), black, "Closes after 5 minutes. Hold the green button to restart.");
        it.printf(40, 440, id(font_text), black, "Firmware ${version}");
      } else if (id(weather_mode)) {
        const auto blue = Color(0, 0, 255), yellow = Color(255, 255, 0);
        const Color icon_colors[] = {black, yellow, blue, red};
        static const char *const weekdays[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
        const WeatherData &w = weather_data;
        it.fill(white);
        if (!w.valid) {
          it.filled_rectangle(0, 0, 800, 12, blue);
          it.print(40, 50, id(font_title), black, "Weather");
          it.print(40, 130, id(font_text), black, id(wifi_configured) ? "Couldn't load the forecast. Trying again in 3 hours."
                                                                      : "Set up WiFi first: hold the green button for 3 seconds.");
          it.print(40, 168, id(font_text), black, "Green button: back to the gallery.");
        } else {
          for (int p = 0; p < WEATHER_PLACES; p++) {
            const WeatherPlace &place = w.places[p];
            const int y0 = p * 228;
            it.filled_rectangle(0, y0, 800, 40, blue);
            it.print(16, y0 + 20, id(font_temp), white, TextAlign::CENTER_LEFT, WEATHER_NAMES[p]);
            if (!std::isnan(place.t_now))
              it.printf(784, y0 + 20, id(font_text), white, TextAlign::CENTER_RIGHT, "now %.0f°", place.t_now);
            for (int i = 0; i < WEATHER_DAYS; i++) {
              const WeatherDay &d = place.days[i];
              const int cx = 80 + 160 * i;
              if (i == 0)
                it.print(cx, y0 + 62, id(font_text), black, TextAlign::CENTER, "Today");
              else
                it.printf(cx, y0 + 62, id(font_text), black, TextAlign::CENTER, "%s %d", weekdays[d.weekday], d.day);
              it.print(cx, y0 + 110, id(font_icon), icon_colors[weather_icon_color(d.code)], TextAlign::CENTER,
                       weather_icon(d.code));
              it.print(cx, y0 + 160, id(font_temp), black, TextAlign::CENTER, "/");
              it.printf(cx - 10, y0 + 160, id(font_temp), red, TextAlign::CENTER_RIGHT, "%.0f°", d.t_max);
              it.printf(cx + 10, y0 + 160, id(font_temp), blue, TextAlign::CENTER_LEFT, "%.0f°", d.t_min);
              const bool wet = d.precip_mm >= 0.1f;
              if (d.precip_prob >= 0)
                it.printf(cx, y0 + 194, id(font_note), wet ? blue : black, TextAlign::CENTER, "%.1f mm  %d%%",
                          d.precip_mm, d.precip_prob);
              else
                it.printf(cx, y0 + 194, id(font_note), wet ? blue : black, TextAlign::CENTER, "%.1f mm", d.precip_mm);
            }
          }
          if (w.stale)
            it.printf(16, 464, id(font_note), red, TextAlign::CENTER_LEFT,
                      "Offline: forecast from %s, retrying every 3 hours", w.updated);
          else
            it.printf(16, 464, id(font_note), black, TextAlign::CENTER_LEFT, "Updated %s, next update at %02d:00", w.updated,
                      WEATHER_REFRESH_HOUR);
        }
      } else {
        // Two pixels per byte, high nibble first; values index GALLERY_PALETTE.
        Color palette[6];
        for (int i = 0; i < 6; i++)
          palette[i] = Color(GALLERY_PALETTE[i][0], GALLERY_PALETTE[i][1], GALLERY_PALETTE[i][2]);
        const uint8_t *px = GALLERY_IMAGES[id(img_index)];
        for (int y = 0; y < GALLERY_H; y++) {
          for (int x = 0; x < GALLERY_W; x += 2, px++) {
            it.draw_pixel_at(x, y, palette[*px >> 4]);
            it.draw_pixel_at(x + 1, y, palette[*px & 0x0F]);
          }
        }
        // The previous refresh crashed on an empty battery: say at which charge.
        const float crash_v = gallery_battery_crash_v();
        if (crash_v > 0) {
          it.filled_rectangle(0, 0, 800, 36, red);
          it.printf(400, 18, id(font_text), white, TextAlign::CENTER,
                    "Battery ran empty during a refresh at %.2f V (%d%%)", crash_v, gallery_battery_percent(crash_v));
        }
      }

      // Battery icon + percentage, bottom-right corner (empty on every layout).
      const float v = id(battery_voltage).state;
      if (!std::isnan(v)) {
        const int pct = gallery_battery_percent(v);
        // Fill colour by charge: green > 50 %, yellow 21-50 %, red <= 20 %.
        const auto fill = pct > 50 ? Color(0, 255, 0) : pct > 20 ? Color(255, 255, 0) : red;
        const int x = 734, y = 452, w = 36, h = 18;  // battery body
        it.filled_rectangle(684, 446, 116, 30, white);
        it.printf(x - 6, y + h / 2, id(font_small), black, TextAlign::CENTER_RIGHT, "%d%%", pct);
        it.rectangle(x, y, w, h, black);
        it.rectangle(x + 1, y + 1, w - 2, h - 2, black);
        it.filled_rectangle(x + w, y + 5, 3, h - 10, black);
        const int level = (w - 6) * pct / 100;
        if (level > 0)
          it.filled_rectangle(x + 3, y + 3, level, h - 6, fill);
      }
